name: Vexata
description: Vexata was an all-flash, NVMe-based enterprise storage startup headquartered in Santa Clara,
  California, known for its Vexata Active Data Fabric software and VX-100 scale-out storage arrays aimed
  at high-performance database and analytics workloads. The company was backed by Lightspeed Venture Partners
  and was acquired by StorCentric in 2019; StorCentric subsequently filed for bankruptcy in 2022. As of
  this enrichment pass the vexata.com domain no longer belongs to the company and redirects to an unrelated
  business (farmhousela.com), the api./developer./docs. subdomains do not resolve, and no developer portal,
  documentation, SDK, or API surface could be found. This profile is retained as a historical/defunct
  company record.
